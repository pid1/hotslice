[project]
name = "hotslice"
version = "0.1.0"
description = "A hot take, one slice at a time. Markdown → HTML slide decks from the CLI."
requires-python = ">=3.14"
dependencies = [
    "markdown-it-py>=3.0",
    "linkify-it-py>=2.0",
    "jinja2>=3.1",
]

[project.scripts]
hotslice = "hotslice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
