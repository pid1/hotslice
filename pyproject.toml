[project]
name = "hotslice"
version = "0.1.0"
description = "A hot take, one slice at a time. Markdown → HTML slide decks from the CLI."
# Held at 3.14: the Cloudflare Worker (worker/) runs this package on Python 3.14,
# the newest Workers runtime. See .github/factory-holds.json.
requires-python = ">=3.14"
dependencies = [
    "markdown-it-py>=4.2",
    "linkify-it-py>=2.2",
    "jinja2>=3.1.6",
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
    "mcp>=2.3",
]

[project.scripts]
hotslice = "hotslice.cli:main"
hotslice-web = "hotslice.web:main"
hotslice-mcp = "hotslice.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# black and ruff format both run in CI. ruff reads line-length from
# [tool.ruff]; black does not, and would otherwise wrap at its default 88,
# so the two disagree on every line between 88 and 100 characters.
[tool.ruff]
target-version = "py314"  # held with requires-python; see .github/factory-holds.json
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Supply-chain cooldown: only resolve releases that have been public for 7
# days, so a hijacked or malicious release is usually pulled before it can
# land here. Keep it relative; a timestamp would freeze the lock instead.
[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
