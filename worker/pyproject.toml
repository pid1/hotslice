# The Cloudflare Worker that serves hotslice.pizza. See docs/deploy.md.
#
# This is a separate project from the root pyproject.toml because pywrangler
# vendors every dependency into the Worker bundle, and the root project pulls
# in uvicorn[standard], whose native extensions have no WebAssembly build.
# Keep this list to what hotslice.web imports at runtime.
[project]
name = "hotslice-worker"
version = "0.1.0"
# 3.14 is the newest Python Workers runtime (see .github/factory-holds.json).
requires-python = ">=3.14"
dependencies = [
    "markdown-it-py>=4.2",
    "linkify-it-py>=2.2",
    "jinja2>=3.1.6",
    "fastapi>=0.143.2",
    "python-multipart>=0.0.32",
    "mcp>=2.3",
]

# Supply-chain cooldown: only resolve releases that have been public for 7
# days, so a hijacked or malicious release is usually pulled before it can
# land here. Keep it relative; a timestamp would freeze the lock instead.
[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "workers-py>=1.17.7",
    "workers-runtime-sdk>=1.9.3",
]
